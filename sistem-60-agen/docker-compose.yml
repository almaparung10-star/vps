services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agen123}
      POSTGRES_DB: ${POSTGRES_DB:-agen60}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-agen}:${POSTGRES_PASSWORD:-agen123}@db:5432/${POSTGRES_DB:-agen60}?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  pgdata:
